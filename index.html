<!-- JAVASCRIPT APP LOGIC -->
<script>
    // --- 1. PRODUCT DATA ---
    const FREESHIP_MIN = 299000;
    const SHIP_FEE = 30000;
    const CUSTOM_PRICE = 199000;

    const productsData = [
        { id: 'p1', name: 'Áo Tay Dài Stay True Longsleeve', category: 'tshirt', price: 199000, rating: 5.0, image: 'áo tay dài.png',
          desc: 'Áo thun tay dài Cotton 280GSM màu đen cao cấp, họa tiết trăng khuyết thêu ngực & chữ STAY TRUE tay áo.' },
        { id: 'p2', name: 'Áo Hoodie Studio Essential Heavyweight', category: 'hoodie', price: 299000, rating: 4.9,
          image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=800&q=80',
          desc: 'Nỉ chân cua cao cấp, mũ đúp 2 lớp giữ form chuẩn streetwear. Thích hợp cho thời tiết thu đông.' },
        { id: 'p3', name: 'Áo Polo Sợi Tre Bamboo Luxury', category: 'polo', price: 249000, rating: 4.8,
          image: 'https://images.unsplash.com/photo-1625910513413-730303e913a8?auto=format&fit=crop&w=800&q=80',
          desc: 'Chất liệu vải tre tự nhiên kháng khuẩn, mềm mịn thoáng mát. Thiết kế cổ bệt lịch sự.' },
        { id: 'p4', name: 'Áo Phông Graphic Custom Studio', category: 'tshirt', price: 145000, rating: 4.7,
          image: 'https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=800&q=80',
          desc: 'Hình in kỹ thuật số DTG sắc nét bền màu. Dáng Unisex vừa vặn cho cả nam và nữ.' },
        { id: 'p5', name: 'Sweatshirt Premium Wearu Monogram', category: 'hoodie', price: 279000, rating: 4.9,
          image: 'https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=800&q=80',
          desc: 'Áo nỉ chui đầu phong cách tối giản sang trọng, dễ phối đồ kết hợp jeans hoặc quần tây.' },
        { id: 'p6', name: 'Áo Polo Casual Black Edition', category: 'polo', price: 219000, rating: 4.8,
          image: 'https://images.unsplash.com/photo-1581655353564-df123a1eb820?auto=format&fit=crop&w=800&q=80',
          desc: 'Gam màu đen huyền bí lịch lãm. Vải pique thoáng khí thấm hút mồ hôi tối đa.' }
    ];

    // --- 2. GLOBAL STATE ---
    let cart = [];
    let customizerState = { color: '#ffffff', text: '', font: 'Plus Jakarta Sans', textColor: '#000000', size: 'M', view: 'front', imageSrc: null };

    // --- 3. CLIENT-SIDE HASH ROUTER ---
    const routes = ['home', 'about', 'customizer', 'collection', 'contact'];

    function handleRouting() {
        let hash = window.location.hash.replace('#', '');
        if (!routes.includes(hash)) hash = 'home';
        document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
        const targetView = document.getElementById(`view-${hash}`);
        if (targetView) targetView.classList.add('active');
        document.querySelectorAll('.nav-link').forEach(link => {
            const route = link.getAttribute('data-route');
            link.className = route === hash
                ? 'nav-link px-3 py-2 text-sm font-semibold tracking-wider transition-colors duration-200 uppercase relative text-brand-gold border-b-2 border-brand-gold'
                : 'nav-link px-3 py-2 text-sm font-semibold tracking-wider transition-colors duration-200 uppercase relative text-[#6F5A4C] hover:text-brand-gold';
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.addEventListener('hashchange', handleRouting);
    window.addEventListener('DOMContentLoaded', () => { handleRouting(); renderBestSellers(); filterProducts(); updateCartUI(); });

    function navigateTo(route, categoryFilter = null) {
        window.location.hash = `#${route}`;
        if (categoryFilter && route === 'collection') {
            setTimeout(() => {
                const radio = document.querySelector(`input[name="catFilter"][value="${categoryFilter}"]`);
                if (radio) { radio.checked = true; filterProducts(); }
            }, 100);
        }
    }

    // --- 4. SHIRT CUSTOMIZER ENGINE ---
    function changeShirtColor(colorHex) {
        customizerState.color = colorHex;
        document.getElementById('shirtBody').setAttribute('fill', colorHex);
    }

    function switchShirtView(view) {
        customizerState.view = view;
        const frontBtn = document.getElementById('viewFrontBtn');
        const backBtn = document.getElementById('viewBackBtn');
        const frontText = document.getElementById('frontTextLayer');
        const backText = document.getElementById('backTextLayer');
        const on = 'px-4 py-1.5 text-xs font-semibold rounded-lg bg-brand-gold text-black transition-all';
        const off = 'px-4 py-1.5 text-xs font-semibold rounded-lg text-[#6F5A4C] hover:text-[#3B2A22] transition-all';
        if (view === 'front') {
            frontBtn.className = on; backBtn.className = off;
            frontText.classList.remove('hidden'); backText.classList.add('hidden');
        } else {
            backBtn.className = on; frontBtn.className = off;
            backText.classList.remove('hidden'); frontText.classList.add('hidden');
        }
    }

    function updateCustomText() {
        const inputVal = document.getElementById('customTextInput').value;
        const fontVal = document.getElementById('fontSelect').value;
        const colorVal = document.getElementById('textColorInput').value;
        customizerState.text = inputVal;
        customizerState.font = fontVal;
        customizerState.textColor = colorVal;
        const textDisplay = document.getElementById('customTextDisplay');
        textDisplay.innerText = inputVal;
        textDisplay.style.fontFamily = fontVal;
        textDisplay.style.color = colorVal;
    }

    function handleImageUpload(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(evt) {
                customizerState.imageSrc = evt.target.result;
                document.getElementById('customImageDisplay').src = evt.target.result;
                document.getElementById('customImageLayer').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
    }

    function selectCustomSize(size) {
        customizerState.size = size;
        document.querySelectorAll('#customSizePicker .size-btn').forEach(btn => {
            btn.className = btn.innerText === size
                ? 'size-btn py-2 text-xs font-bold border border-brand-gold bg-brand-gold/10 text-brand-gold rounded-xl'
                : 'size-btn py-2 text-xs font-bold border border-[#8B5E3C]/25 rounded-xl text-[#6F5A4C] hover:border-brand-gold';
        });
    }

    function resetCustomizer() {
        changeShirtColor('#ffffff');
        document.getElementById('customTextInput').value = '';
        document.getElementById('customImageLayer').classList.add('hidden');
        updateCustomText();
    }

    function addCustomShirtToCart() {
        addToCart({
            id: 'custom-' + Date.now(),
            name: `Áo Tự Thiết Kế (${customizerState.size})`,
            price: CUSTOM_PRICE,
            size: customizerState.size,
            image: 'áo tay dài.png',
            isCustom: true,
            details: customizerState.text ? `Chữ: "${customizerState.text}"` : 'Mẫu thiết kế riêng',
            quantity: 1
        });
        openCartDrawer();
    }

    // --- 5. PRODUCTS & COLLECTION ---
    function formatVND(amount) { return amount.toLocaleString('vi-VN') + 'đ'; }

    function renderBestSellers() {
        const container = document.getElementById('homeBestSellers');
        if (!container) return;
        container.innerHTML = productsData.slice(0, 4).map(p => `
            <div class="bg-brand-card border border-[#8B5E3C]/15 rounded-2xl overflow-hidden group hover:border-brand-gold/50 transition-all duration-300 flex flex-col justify-between">
                <div class="relative overflow-hidden h-64 bg-[#3B2A22]/8">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <button onclick="openProductModal('${p.id}')" class="absolute bottom-3 right-3 p-3 bg-[#3B2A22]/50 hover:bg-brand-gold hover:text-black text-[#3B2A22] rounded-xl backdrop-blur-md transition-colors text-xs font-bold">Xem Nhanh</button>
                </div>
                <div class="p-5 flex flex-col flex-grow justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] uppercase font-bold text-brand-gold tracking-widest">${p.category}</span>
                            <span class="text-xs text-yellow-400 font-semibold"><i class="fa-solid fa-star text-[10px]"></i> ${p.rating}</span>
                        </div>
                        <h3 class="font-bold text-[#3B2A22] text-base line-clamp-1 mb-2">${p.name}</h3>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-[#8B5E3C]/10">
                        <span class="text-brand-gold font-bold text-lg">${formatVND(p.price)}</span>
                        <button onclick="quickAddToCart('${p.id}')" class="p-2.5 bg-white/10 hover:bg-brand-gold hover:text-black text-[#3B2A22] rounded-xl transition-colors"><i class="fa-solid fa-cart-plus"></i></button>
                    </div>
                </div>
            </div>`).join('');
    }

    function filterProducts() {
        const cat = document.querySelector('input[name="catFilter"]:checked')?.value || 'all';
        const maxPrice = parseInt(document.getElementById('priceRange')?.value || 299000);
        const sort = document.getElementById('sortSelect')?.value || 'featured';

        let filtered = productsData.filter(p => (cat === 'all' || p.category === cat) && p.price <= maxPrice);
        if (sort === 'low-high') filtered.sort((a, b) => a.price - b.price);
        else if (sort === 'high-low') filtered.sort((a, b) => b.price - a.price);

        const grid = document.getElementById('productGrid');
        const countText = document.getElementById('productCount');
        if (countText) countText.innerText = `Hiển thị ${filtered.length} sản phẩm`;
        if (!grid) return;

        if (filtered.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-12 text-[#806B5D]">Không tìm thấy sản phẩm nào phù hợp với bộ lọc.</div>`;
            return;
        }
        grid.innerHTML = filtered.map(p => `
            <div class="bg-brand-card border border-[#8B5E3C]/15 rounded-2xl overflow-hidden group hover:border-brand-gold/50 transition-all duration-300 flex flex-col justify-between">
                <div class="relative overflow-hidden h-72 bg-[#3B2A22]/8">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    <button onclick="openProductModal('${p.id}')" class="absolute bottom-3 right-3 p-3 bg-[#3B2A22]/50 hover:bg-brand-gold hover:text-black text-[#3B2A22] rounded-xl backdrop-blur-md transition-colors text-xs font-bold">Xem Nhanh</button>
                </div>
                <div class="p-5 flex flex-col flex-grow justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] uppercase font-bold text-brand-gold tracking-widest">${p.category}</span>
                            <span class="text-xs text-yellow-400 font-semibold"><i class="fa-solid fa-star text-[10px]"></i> ${p.rating}</span>
                        </div>
                        <h3 class="font-bold text-[#3B2A22] text-base line-clamp-1 mb-2">${p.name}</h3>
                        <p class="text-xs text-[#806B5D] line-clamp-2 mb-4 font-light">${p.desc}</p>
                    </div>
                    <div class="flex justify-between items-center pt-3 border-t border-[#8B5E3C]/10">
                        <span class="text-brand-gold font-bold text-lg">${formatVND(p.price)}</span>
                        <button onclick="quickAddToCart('${p.id}')" class="px-4 py-2 bg-brand-gold text-black font-bold rounded-xl text-xs hover:bg-[#6B3F2A] transition-colors flex items-center gap-1.5"><i class="fa-solid fa-cart-plus"></i> Thêm</button>
                    </div>
                </div>
            </div>`).join('');
    }

    function updatePriceFilter(val) {
        document.getElementById('priceValue').innerText = `Dưới ${formatVND(parseInt(val))}`;
        filterProducts();
    }

    // --- 6. SHOPPING CART ---
    function calcShipping(subtotal) { return (subtotal === 0 || subtotal >= FREESHIP_MIN) ? 0 : SHIP_FEE; }

    function quickAddToCart(productId) {
        const p = productsData.find(x => x.id === productId);
        if (!p) return;
        addToCart({ id: p.id + '-M', productId: p.id, name: p.name, price: p.price, size: 'M', image: p.image, quantity: 1 });
        openCartDrawer();
    }

    function addToCart(item) {
        const i = cart.findIndex(x => x.id === item.id);
        if (i > -1) cart[i].quantity += 1; else cart.push(item);
        updateCartUI();
    }

    function updateQuantity(itemId, delta) {
        const idx = cart.findIndex(i => i.id === itemId);
        if (idx > -1) {
            cart[idx].quantity += delta;
            if (cart[idx].quantity <= 0) cart.splice(idx, 1);
        }
        updateCartUI();
    }

    function removeFromCart(itemId) {
        cart = cart.filter(i => i.id !== itemId);
        updateCartUI();
    }

    function updateCartUI() {
        const badge = document.getElementById('cartBadge');
        const list = document.getElementById('cartItemList');
        const totalCount = cart.reduce((s, i) => s + i.quantity, 0);
        const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        const ship = calcShipping(subtotal);

        if (badge) badge.innerText = totalCount;
        const sub = document.getElementById('cartSubtotal'); if (sub) sub.innerText = formatVND(subtotal);
        const shipEl = document.getElementById('cartShipping'); if (shipEl) shipEl.innerText = ship === 0 ? 'Miễn phí' : formatVND(ship);
        const tot = document.getElementById('cartTotal'); if (tot) tot.innerText = formatVND(subtotal + ship);

        if (!list) return;
        if (cart.length === 0) {
            list.innerHTML = `<div class="text-center py-12 text-[#927C6D]"><i class="fa-solid fa-bag-shopping text-4xl mb-3 text-gray-600 block"></i>Giỏ hàng của bạn đang trống</div>`;
            return;
        }
        list.innerHTML = cart.map(item => `
            <div class="flex gap-4 p-3 bg-[#3B2A22]/8 border border-[#8B5E3C]/10 rounded-xl items-center">
                <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg border border-[#8B5E3C]/15 shrink-0">
                <div class="flex-grow">
                    <h4 class="text-xs font-bold text-[#3B2A22] line-clamp-1">${item.name}</h4>
                    <div class="text-[10px] text-[#806B5D] mt-0.5">Size: <span class="text-brand-gold font-bold">${item.size}</span></div>
                    ${item.details ? `<div class="text-[10px] text-brand-gold">${item.details}</div>` : ''}
                    <div class="text-xs font-bold text-brand-gold mt-1">${formatVND(item.price)}</div>
                </div>
                <div class="flex flex-col items-end gap-2">
                    <button onclick="removeFromCart('${item.id}')" class="text-[#927C6D] hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                    <div class="flex items-center gap-2 bg-brand-card px-2 py-1 rounded-lg border border-[#8B5E3C]/15 text-xs">
                        <button onclick="updateQuantity('${item.id}', -1)" class="text-[#806B5D] hover:text-[#3B2A22]">-</button>
                        <span class="font-bold text-[#3B2A22] min-w-[12px] text-center">${item.quantity}</span>
                        <button onclick="updateQuantity('${item.id}', 1)" class="text-[#806B5D] hover:text-[#3B2A22]">+</button>
                    </div>
                </div>
            </div>`).join('');
    }

    function openCartDrawer() {
        document.getElementById('cartDrawerBackdrop').classList.remove('opacity-0', 'pointer-events-none');
        document.getElementById('cartDrawer').classList.remove('translate-x-full');
    }
    function closeCartDrawer() {
        document.getElementById('cartDrawerBackdrop').classList.add('opacity-0', 'pointer-events-none');
        document.getElementById('cartDrawer').classList.add('translate-x-full');
    }

    // --- 7. MODALS ---
    function openProductModal(productId) {
        const p = productsData.find(x => x.id === productId);
        if (!p) return;
        document.getElementById('productModalContent').innerHTML = `
            <button onclick="closeProductModal()" class="absolute top-4 right-4 text-[#806B5D] hover:text-[#3B2A22] p-2 z-10"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                <div class="rounded-xl overflow-hidden h-72 bg-[#3B2A22]/8"><img src="${p.image}" class="w-full h-full object-cover"></div>
                <div class="space-y-4">
                    <span class="text-xs uppercase font-bold text-brand-gold tracking-widest">${p.category}</span>
                    <h2 class="text-2xl font-bold text-[#3B2A22]">${p.name}</h2>
                    <div class="text-yellow-400 text-xs flex items-center gap-1 font-semibold"><i class="fa-solid fa-star"></i> ${p.rating} (48 đánh giá)</div>
                    <p class="text-xs text-[#6F5A4C] leading-relaxed font-light">${p.desc}</p>
                    <div class="text-2xl font-bold text-brand-gold">${formatVND(p.price)}</div>
                    <div class="pt-4 flex gap-3">
                        <button onclick="quickAddToCart('${p.id}'); closeProductModal();" class="flex-grow py-3 bg-brand-gold text-black font-bold uppercase tracking-wider text-xs rounded-xl hover:bg-[#6B3F2A] transition-colors">Thêm Vào Giỏ Hàng</button>
                    </div>
                </div>
            </div>`;
        document.getElementById('productModal').classList.remove('opacity-0', 'pointer-events-none');
    }
    function closeProductModal() {
        document.getElementById('productModal').classList.add('opacity-0', 'pointer-events-none');
    }

    function openCheckoutModal() {
        if (cart.length === 0) { alert('Giỏ hàng của bạn đang trống!'); return; }
        closeCartDrawer();
        const subtotal = cart.reduce((s, i) => s + i.price * i.quantity, 0);
        document.getElementById('checkoutTotal').innerText = formatVND(subtotal + calcShipping(subtotal));
        document.getElementById('checkoutModal').classList.remove('opacity-0', 'pointer-events-none');
    }
    function closeCheckoutModal() {
        document.getElementById('checkoutModal').classList.add('opacity-0', 'pointer-events-none');
    }
    function processCheckout(e) {
        e.preventDefault();
        alert('🎉 Đặt hàng thành công! Wearu Studio sẽ liên hệ xác nhận đơn hàng sớm nhất.');
        cart = [];
        updateCartUI();
        closeCheckoutModal();
    }
    function handleContactSubmit(e) {
        e.preventDefault();
        alert('📩 Yêu cầu hỗ trợ của bạn đã được gửi. Wearu sẽ phản hồi trong 2 giờ làm việc!');
        e.target.reset();
    }

    // --- 8. HEADER EVENTS ---
    function toggleNotifications() { document.getElementById('notifMenu').classList.toggle('hidden'); }
    function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('hidden'); }
    function closeMobileMenu() { document.getElementById('mobileMenu').classList.add('hidden'); }
</script>
