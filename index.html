<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUMI - Thời Trang Hiện Đại</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
    background: #fff;
}

a {
    text-decoration: none;
    color: inherit;
}

/* ================= HEADER ================= */

header {
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
    border-bottom: 1px solid #eee;
    background: white;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 4px;
}

nav {
    display: flex;
    gap: 30px;
}

nav a {
    font-size: 14px;
    font-weight: 600;
    transition: .3s;
}

nav a:hover {
    color: #9b6b43;
}

.header-icons {
    display: flex;
    gap: 18px;
    font-size: 20px;
}

/* ================= HERO ================= */

.hero {
    min-height: 620px;

    background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.25)),
        linear-gradient(120deg, #c8b39d, #eee4d8);

    display: flex;
    align-items: center;
    padding: 0 9%;
    color: white;
}

.hero-content {
    max-width: 600px;
}

.hero-content span {
    font-size: 14px;
    letter-spacing: 4px;
}

.hero h1 {
    font-size: clamp(45px, 7vw, 82px);
    line-height: 1;
    margin: 20px 0;
    font-weight: 800;
}

.hero p {
    font-size: 17px;
    margin-bottom: 30px;
    line-height: 1.7;
}

.btn {
    display: inline-block;
    background: white;
    color: #222;
    padding: 15px 30px;
    font-size: 13px;
    font-weight: bold;
    transition: .3s;
    border: none;
    cursor: pointer;
}

.btn:hover {
    background: #222;
    color: white;
}

/* ================= SECTION ================= */

section {
    padding: 80px 7%;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title span {
    color: #9b6b43;
    font-size: 13px;
    letter-spacing: 3px;
    font-weight: bold;
}

.section-title h2 {
    font-size: 36px;
    margin-top: 10px;
}

/* =====================================================
   CUSTOM T-SHIRT DESIGNER - PHIÊN BẢN LỚN
===================================================== */

.customizer {
    background: #f7f7f5;

    /* TĂNG KHOẢNG CÁCH */
    padding: 110px 4%;
}

.customizer-header {
    text-align: center;
    margin-bottom: 55px;
}

.customizer-header span {
    color: #9b6b43;
    font-size: 15px;
    letter-spacing: 3px;
    font-weight: bold;
}

.customizer-header h2 {
    font-size: 46px;
    margin: 15px 0;
}

.custom
